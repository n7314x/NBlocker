name: Release artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag for the prerelease
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - run: xcodebuild -version
      - run: ./scripts/install-xcodegen.sh
      - run: ./scripts/lint.sh
      - run: ./scripts/build-ipa.sh
      - name: Publish unsigned prerelease artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            .build/ipa/NBlocker-unsigned.ipa \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "NBlocker ${{ inputs.tag }} (unsigned)"
