name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: ./scripts/install-xcodegen.sh
      - name: Validate resources
        run: ./scripts/lint.sh
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          mkdir -p .build
          ./scripts/build-ipa.sh 2>&1 | tee .build/ipa-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-build-log
          path: .build/ipa-build.log
          if-no-files-found: ignore
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NBlocker-unsigned
          path: .build/ipa/NBlocker-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
