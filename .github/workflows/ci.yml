name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: ./scripts/install-xcodegen.sh
      - name: Lint repository resources
        run: ./scripts/lint.sh
      - name: Generate project
        run: ./scripts/generate-project.sh
      - name: Build for simulator
        run: |
          set -o pipefail
          mkdir -p .build
          xcodebuild \
            -project NBlocker.xcodeproj \
            -scheme NBlocker \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee .build/build.log
      - name: Choose simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); phones=[(runtime,d) for runtime,devices in data["devices"].items() for d in devices if d["name"].startswith("iPhone")]; preferred=[item for item in phones if ".iOS-26-" in item[0]]; pool=preferred or phones; pool.sort(key=lambda item:(item[0],item[1]["name"])); print(pool[-1][1]["udid"] if pool else "")')"
          test -n "$simulator_id"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Run unit and navigation UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project NBlocker.xcodeproj \
            -scheme NBlocker \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath .build/DerivedData \
            -only-testing:NBlockerTests \
            -only-testing:NBlockerUITests/NavigationUITests \
            CODE_SIGNING_ALLOWED=NO \
            test | tee .build/tests.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: .build/*.log
